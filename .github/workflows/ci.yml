name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build release APK + web dashboard artifacts'
        type: boolean
        default: false

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: flutter test

      - name: Web build (dashboard, staging)
        run: flutter build web -t lib/main_dashboard.dart --dart-define=APP_FLAVOR=staging

      # Device matrix / ARCore / classroom pilot are NOT run in CI (see docs/E7_DEVICE_MATRIX.md).

  release_artifacts:
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    runs-on: ubuntu-latest
    needs: analyze_and_test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL / SUPABASE_ANON_KEY secrets — skipping signed env defines."
            flutter build apk -t lib/main_mobile.dart --release --dart-define=APP_FLAVOR=prod
          else
            flutter build apk \
              -t lib/main_mobile.dart \
              --release \
              --dart-define=APP_FLAVOR=prod \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          fi

      - name: Release Web dashboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            flutter build web -t lib/main_dashboard.dart --release --dart-define=APP_FLAVOR=prod
          else
            flutter build web \
              -t lib/main_dashboard.dart \
              --release \
              --dart-define=APP_FLAVOR=prod \
              --dart-define=SUPABASE_URL="$SUPABASE_URL" \
              --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cell-forensic-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cell-forensic-web-dashboard
          path: build/web/
